{% extends "base.html" %}

{% block title %}Sign In | iSellora{% endblock %}

{% block extra_css %}
<style>
    .auth-card {
        max-width: 440px;
        margin: 40px auto 70px;
        background: white;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 36px 32px;
        box-shadow: var(--shadow-sm);
    }

    .auth-header {
        text-align: center;
        margin-bottom: 28px;
    }

    .auth-header h1 {
        font-size: 24px;
        font-weight: 800;
        margin-bottom: 6px;
    }

    .auth-header p {
        color: var(--text-muted);
        font-size: 14px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 6px;
    }

    .form-input {
        width: 100%;
        padding: 11px 14px;
        background: #f8fafc;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        font-size: 14px;
        color: var(--text-main);
    }

    .form-input:focus {
        outline: none;
        background: white;
        border-color: var(--border-focus);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .btn-auth {
        width: 100%;
        background: var(--primary);
        color: white;
        border: none;
        padding: 12px;
        border-radius: var(--radius-md);
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
        transition: background 0.2s;
    }

    .btn-auth:hover {
        background: var(--primary-hover);
    }

    .auth-footer {
        text-align: center;
        margin-top: 24px;
        font-size: 13px;
        color: var(--text-muted);
    }

    .auth-footer a {
        color: var(--primary);
        font-weight: 700;
    }
</style>
{% endblock %}

{% block content %}
<div class="container">

    <div class="auth-card">
        <div class="auth-header">
            <h1>Sign in to iSellora</h1>
            <p>Access your listings, sales, and order tracking</p>
        </div>

        <form action="{{ url_for('login', next=request.args.get('next')) }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="name@example.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Your password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-auth">Sign In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('signup') }}">Create one now</a>
        </div>
    </div>

</div>
{% endblock %}
