{% extends "base.html" %}

{% block title %}Administrator Portal | iSellora{% endblock %}

{% block extra_css %}
<style>
    .admin-auth-card {
        max-width: 440px;
        margin: 50px auto 80px;
        background: white;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 40px 32px;
        box-shadow: var(--shadow-md);
        text-align: center;
    }

    .admin-badge-icon {
        width: 56px;
        height: 56px;
        background: #312e81;
        color: white;
        border-radius: var(--radius-full);
        display: grid;
        place-items: center;
        font-size: 24px;
        margin: 0 auto 18px;
    }

    .admin-auth-card h1 {
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 6px;
    }

    .admin-auth-card p {
        color: var(--text-muted);
        font-size: 13px;
        margin-bottom: 24px;
    }

    .form-group {
        margin-bottom: 18px;
        text-align: left;
    }

    .form-label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 6px;
    }

    .form-input {
        width: 100%;
        padding: 10px 14px;
        background: #f8fafc;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        font-size: 14px;
    }

    .btn-admin-login {
        width: 100%;
        background: #312e81;
        color: white;
        border: none;
        padding: 13px;
        border-radius: var(--radius-md);
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
        transition: background 0.2s;
    }

    .btn-admin-login:hover {
        background: #1e1b4b;
    }
</style>
{% endblock %}

{% block content %}
<div class="container">

    <div class="admin-auth-card">
        <div class="admin-badge-icon">🛡️</div>
        <h1>Staff & Administration Access</h1>
        <p>Restricted access for platform moderators and verified administrators.</p>

        <form action="{{ url_for('admin_login') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label" for="email">Admin Email</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="admin@isellora.local" required autocomplete="email">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-admin-login">Sign in to Admin Console</button>
        </form>
    </div>

</div>
{% endblock %}
