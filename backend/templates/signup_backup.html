<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>iSellora | Create Account</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #6a11cb, #2575fc);
        padding: 20px;
    }

    .signup-box {
        width: 100%;
        max-width: 430px;
        background: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    .logo {
        text-align: center;
        font-size: 28px;
        font-weight: bold;
        color: #6a11cb;
        margin-bottom: 8px;
    }

    h1 {
        text-align: center;
        font-size: 25px;
        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #777;
        font-size: 14px;
        margin-bottom: 25px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 7px;
        font-size: 14px;
    }

    input {
        width: 100%;
        padding: 13px;
        border: 1px solid #ddd;
        border-radius: 10px;
        margin-bottom: 16px;
        font-size: 15px;
        outline: none;
    }

    input:focus {
        border-color: #6a11cb;
    }

    .signup-btn {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #6a11cb, #2575fc);
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .signup-btn:hover {
        opacity: 0.9;
    }

    .login-link {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
    }

    .login-link a {
        color: #6a11cb;
        font-weight: bold;
        text-decoration: none;
    }

    .home-link {
        display: block;
        text-align: center;
        margin-top: 15px;
        color: #777;
        text-decoration: none;
        font-size: 14px;
    }
</style>
```

</head>

<body>

```
<div class="signup-box">

    <div class="logo">
        📱 iSellora
    </div>

    <h1>Create Account</h1>

    <p class="subtitle">
        Create your iSellora account
    </p>

    <form action="/signup" method="POST">

        <label>
            Full Name
        </label>

        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            required
        >

        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label>
            Phone Number
        </label>

        <input
            type="tel"
            name="phone"
            placeholder="10-digit phone number"
            pattern="[0-9]{10}"
            maxlength="10"
            required
        >

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Create password"
            minlength="6"
            required
        >

        <button
            type="submit"
            class="signup-btn"
        >
            Create Account
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="/login">
            Login
        </a>
    </div>

    <a
        href="/"
        class="home-link"
    >
        ← Back to Home
    </a>

</div>
```

</body>
</html>
